<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" fill="none">
  <defs>
    <!-- Brand Warm Gradients -->
    <linearGradient id="logoCupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#341e15"/>
      <stop offset="50%" stop-color="#22140D"/>
      <stop offset="100%" stop-color="#120906"/>
    </linearGradient>

    <linearGradient id="logoRoseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8fa0"/>
      <stop offset="50%" stop-color="#E87A88"/>
      <stop offset="100%" stop-color="#d65b6c"/>
    </linearGradient>

    <linearGradient id="logoCaramelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#febe9e"/>
      <stop offset="50%" stop-color="#c8894f"/>
      <stop offset="100%" stop-color="#835339"/>
    </linearGradient>

    <linearGradient id="logoSteamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E87A88" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#E87A88" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffb2b8" stop-opacity="1"/>
    </linearGradient>

    <!-- Filters for Glow and Depth -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="logoSoftShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#22140D" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- ================= LOGO ICON EMBLEM (Left side: x = 4 to 58) ================= -->
  <g transform="translate(6, 4)" filter="url(#logoSoftShadow)">
    <!-- Elegant Ceramic Saucer Base -->
    <ellipse cx="26" cy="46" rx="22" ry="3.8" fill="#fdeae3" stroke="#835339" stroke-width="1.2" stroke-opacity="0.4"/>
    <ellipse cx="26" cy="45.5" rx="16" ry="2.2" fill="#fff8f6" opacity="0.85"/>

    <!-- Artisan Ceramic Cup Body -->
    <path d="M 12 25 C 12 39, 18 45, 26 45 C 34 45, 40 39, 40 25 Z" fill="url(#logoCupGrad)" stroke="#835339" stroke-width="1.2"/>
    
    <!-- Cup Rim (Inner Coffee Surface) -->
    <ellipse cx="26" cy="25" rx="14" ry="4.2" fill="#1b0e09" stroke="url(#logoCaramelGrad)" stroke-width="1.2"/>
    
    <!-- Golden Crema & Latte Art Sparkle -->
    <ellipse cx="26" cy="25.2" rx="11.5" ry="3" fill="#2d1710"/>
    <path d="M 19 25.5 Q 26 27.5 33 25.5" fill="none" stroke="#febe9e" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

    <!-- Delicate Curved Ceramic Handle -->
    <path d="M 39 28 C 46 28, 46 38, 38 40" fill="none" stroke="#835339" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 39 28 C 46 28, 46 38, 38 40" fill="none" stroke="#febe9e" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Rising Romance Steam & Cupid Heart -->
    <g filter="url(#logoGlow)">
      <!-- Left Steam Ribbon -->
      <path d="M 22 21 C 21 16, 17 14, 20 9 C 22 6, 26 5, 26 5" fill="none" stroke="url(#logoSteamGrad)" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Right Steam Ribbon -->
      <path d="M 30 21 C 31 16, 35 14, 32 9 C 30 6, 26 5, 26 5" fill="none" stroke="url(#logoSteamGrad)" stroke-width="1.6" stroke-linecap="round"/>
      
      <!-- Central Floating Blush Cupid Heart -->
      <path d="M 26 8.5 C 26 8.5, 22.5 4, 19 6.5 C 16 8.6, 17.5 13, 26 18 C 34.5 13, 36 8.6, 33 6.5 C 29.5 4, 26 8.5, 26 8.5 Z" 
            fill="url(#logoRoseGrad)" opacity="0.95"/>
      <!-- Internal Heart Highlight -->
      <circle cx="26" cy="11.5" r="1.1" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- ================= BRAND TYPOGRAPHY (Right side) ================= -->
  <!-- Main Title: CupDate in Editorial High-Contrast Serif Style -->
  <g transform="translate(64, 34)">
    <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="-0.02em" fill="#22140D">
      Cup<tspan fill="#E87A88" font-weight="800">Date</tspan>
    </text>
    
    <!-- Romantic Cupid Heart Accent Floating over Date -->
    <path d="M 128 -17 C 128 -17, 126 -19.5, 123.5 -18 C 121.5 -16.5, 122.5 -13.5, 128 -10 C 133.5 -13.5, 134.5 -16.5, 132.5 -18 C 130 -19.5, 128 -17, 128 -17 Z" 
          fill="#E87A88" opacity="0.9" filter="url(#logoGlow)"/>
    <!-- Tiny Sparkle Dot -->
    <circle cx="138" cy="-14" r="1.2" fill="#ff94a2" opacity="0.8"/>
  </g>

  <!-- Tagline: Atelier des Rencontres • Curated Coffee Courtship -->
  <g transform="translate(65, 49)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.8" font-weight="700" letter-spacing="0.16em" fill="#835339" text-transform="uppercase" opacity="0.9">
      Atelier des Rencontres
    </text>
    <!-- Dot separator -->
    <circle cx="156" cy="-3" r="1.4" fill="#E87A88" opacity="0.85"/>
  </g>
</svg>
