<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cupdatePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6584"/>
      <stop offset="50%" stop-color="#ff4d79"/>
      <stop offset="100%" stop-color="#e0285a"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#ff6b8b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff4d79" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Glowing Love Steam -->
  <g filter="url(#softGlow)">
    <!-- Swirling Steam Left -->
    <path d="M 38 42 C 34 32, 40 26, 44 20" fill="none" stroke="#ff8da1" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Swirling Steam Right -->
    <path d="M 62 42 C 66 32, 60 26, 56 20" fill="none" stroke="#ff8da1" stroke-width="2.8" stroke-linecap="round"/>
    <!-- Center Floating Heart -->
    <path d="M 50 28 C 50 28, 43 20, 37 23 C 31 26, 32 34, 50 46 C 68 34, 69 26, 63 23 C 57 20, 50 28, 50 28 Z" fill="url(#heartGrad)"/>
  </g>

  <!-- Modern Coffee Cup -->
  <!-- Cup Rim -->
  <ellipse cx="50" cy="50" rx="27" ry="5.5" fill="none" stroke="url(#cupdatePinkGrad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Coffee Liquid Surface -->
  <ellipse cx="50" cy="52" rx="23" ry="3.8" fill="#fff0f5" stroke="#f7dbe4" stroke-width="1.2"/>
  
  <!-- Cup Body -->
  <path d="M 23 50 C 24 68, 33 80, 50 80 C 67 80, 76 68, 77 50" fill="none" stroke="url(#cupdatePinkGrad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Coffee Heart Lattee Art Line inside Cup -->
  <path d="M 36 58 Q 50 66 64 58" fill="none" stroke="#ff4d79" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  
  <!-- Cup Handle -->
  <path d="M 74 54 C 85 54, 87 68, 71 72" fill="none" stroke="url(#cupdatePinkGrad)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Cup Saucer Base -->
  <path d="M 32 85 Q 50 89 68 85" fill="none" stroke="#ff4d79" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
