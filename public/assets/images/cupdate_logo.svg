<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <defs>
    <!-- Warm Espresso & Rose Gradients matching Theme Tokens -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="50%" stop-color="#22140D"/>
      <stop offset="100%" stop-color="#140a06"/>
    </linearGradient>

    <linearGradient id="roseAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff94a2"/>
      <stop offset="50%" stop-color="#E87A88"/>
      <stop offset="100%" stop-color="#d65b6c"/>
    </linearGradient>

    <linearGradient id="caramelGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#febe9e"/>
      <stop offset="50%" stop-color="#c8894f"/>
      <stop offset="100%" stop-color="#835339"/>
    </linearGradient>

    <linearGradient id="steamSoftGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E87A88" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#E87A88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb2b8" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22140D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- ================= LOGO ICON EMBLEM (Left: 0 to 52) ================= -->
  <g transform="translate(6, 4)" filter="url(#softShadow)">
    <!-- Elegant Ceramic Saucer Plate Base -->
    <ellipse cx="26" cy="46" rx="22" ry="3.5" fill="#fdeae3" stroke="#835339" stroke-width="1.2" stroke-opacity="0.45"/>
    <ellipse cx="26" cy="45.5" rx="16" ry="2" fill="#fff8f6" opacity="0.8"/>

    <!-- Artisan Ceramic Cup Body (Tapered Silhouette) -->
    <path d="M 12 25 C 12 39, 18 45, 26 45 C 34 45, 40 39, 40 25 Z" fill="url(#cupGrad)" stroke="#835339" stroke-width="1.2"/>
    
    <!-- Porcelain Cup Rim (Inner Coffee Surface) -->
    <ellipse cx="26" cy="25" rx="14" ry="4.2" fill="#1b0e09" stroke="url(#caramelGoldGrad)" stroke-width="1.2"/>
    
    <!-- Golden Crema Ring with Latte Art Glisten -->
    <ellipse cx="26" cy="25.2" rx="11.5" ry="3" fill="#2d1710"/>
    <path d="M 19 25.5 Q 26 27.5 33 25.5" fill="none" stroke="#febe9e" stroke-width="1" stroke-linecap="round" opacity="0.85"/>

    <!-- Delicate Curved Ceramic Handle -->
    <path d="M 39 28 C 46 28, 46 38, 38 40" fill="none" stroke="#835339" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 39 28 C 46 28, 46 38, 38 40" fill="none" stroke="#febe9e" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Rising Romance Steam that blossoms into a Heart (Blush Rose Glow) -->
    <g filter="url(#roseGlow)">
      <!-- Left Steam Ribbon -->
      <path d="M 22 21 C 21 16, 17 14, 20 9 C 22 6, 26 5, 26 5" fill="none" stroke="url(#steamSoftGrad)" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Right Steam Ribbon forming Heart Top -->
      <path d="M 30 21 C 31 16, 35 14, 32 9 C 30 6, 26 5, 26 5" fill="none" stroke="url(#steamSoftGrad)" stroke-width="1.6" stroke-linecap="round"/>
      
      <!-- Central Floating Blush Heart Spark -->
      <path d="M 26 8.5 C 26 8.5, 22.5 4, 19 6.5 C 16 8.6, 17.5 13, 26 18 C 34.5 13, 36 8.6, 33 6.5 C 29.5 4, 26 8.5, 26 8.5 Z" 
            fill="url(#roseAccentGrad)" opacity="0.95"/>
      <!-- Internal tiny sparkle dot -->
      <circle cx="26" cy="11.5" r="1.1" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- ================= BRAND TYPOGRAPHY (Right: 62 to 240) ================= -->
  <!-- Main Title: CupDate with Editorial High-Contrast Serif Style -->
  <g transform="translate(62, 34)">
    <text font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="27" font-weight="600" letter-spacing="-0.02em" fill="#22140D">
      Cup<tspan fill="#E87A88" font-weight="700">Date</tspan>
    </text>
    
    <!-- Romantic Accent Heartlet on Top-Right of Date -->
    <path d="M 124 -17 C 124 -17, 122 -19.5, 119.5 -18 C 117.5 -16.5, 118.5 -13.5, 124 -10 C 129.5 -13.5, 130.5 -16.5, 128.5 -18 C 126 -19.5, 124 -17, 124 -17 Z" 
          fill="#E87A88" opacity="0.9" filter="url(#roseGlow)"/>
  </g>

  <!-- Subtitle Tagline: Atelier des Rencontres • Curated Courtship -->
  <g transform="translate(63, 49)">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="0.14em" fill="#835339" text-transform="uppercase" opacity="0.9">
      Atelier des Rencontres
    </text>
    <!-- Dot separator -->
    <circle cx="166" cy="-3" r="1.3" fill="#E87A88" opacity="0.8"/>
  </g>
</svg>
