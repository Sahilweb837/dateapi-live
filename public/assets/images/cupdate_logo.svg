<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Hot Neon Pink & Coffee Gradients -->
    <linearGradient id="neonPinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>

    <linearGradient id="coffeeGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd59e"/>
      <stop offset="50%" stop-color="#d4924b"/>
      <stop offset="100%" stop-color="#8b5a2b"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ff80bf"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff007f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Ambient Neon Glow Background -->
  <circle cx="80" cy="80" r="72" fill="#180e0c" stroke="url(#neonPinkGrad)" stroke-width="2.5" opacity="0.95" filter="url(#subtleShadow)"/>
  <circle cx="80" cy="80" r="69" fill="none" stroke="#ff007f" stroke-width="0.8" opacity="0.4"/>

  <!-- Darting Heart Cupid Arrow Swoosh (Darting Animation Feel) -->
  <g filter="url(#neonGlowPink)">
    <!-- Darting Speed Trail -->
    <path d="M 28 116 Q 42 74 94 48" fill="none" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 6"/>
    <!-- Dart Arrow Head -->
    <polygon points="128,34 116,42 120,49" fill="#ff007f"/>
    <!-- Arrow Feather Tail -->
    <path d="M 26 118 L 22 124 M 29 115 L 26 122 M 32 112 L 30 119" stroke="#ff4081" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Modern Coffee Cup with Steam -->
  <!-- Swirling Aroma Steams Forming Heart -->
  <g filter="url(#neonGlowPink)">
    <path d="M 68 56 C 64 42, 74 34, 80 26 C 86 34, 96 42, 92 56" fill="none" stroke="#ff4081" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Floating Neon Heart Center -->
    <path d="M 80 34 C 80 34, 75 27, 70 29 C 65 31, 66 38, 80 47 C 94 38, 95 31, 90 29 C 85 27, 80 34, 80 34 Z" fill="#ff007f"/>
  </g>

  <!-- Coffee Cup Rim & Body -->
  <ellipse cx="80" cy="74" rx="34" ry="7.5" fill="#2d1710" stroke="url(#neonPinkGrad)" stroke-width="3.5" filter="url(#subtleShadow)"/>
  
  <!-- Coffee Liquid Brew with Golden Latte Art Ring -->
  <ellipse cx="80" cy="76" rx="29" ry="5.5" fill="#3d1d12" stroke="url(#coffeeGoldGrad)" stroke-width="1.6"/>
  <path d="M 65 76 Q 80 82 95 76" fill="none" stroke="#ffd59e" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>

  <!-- Cup Tapered Body -->
  <path d="M 46 74 C 48 98, 58 114, 80 114 C 102 114, 112 98, 114 74" fill="none" stroke="url(#neonPinkGrad)" stroke-width="3.8" stroke-linecap="round" filter="url(#subtleShadow)"/>

  <!-- Glowing Cup Handle -->
  <path d="M 111 80 C 126 80, 128 98, 107 103" fill="none" stroke="url(#neonPinkGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Cup Saucer Base -->
  <ellipse cx="80" cy="119" rx="38" ry="4.5" fill="none" stroke="url(#coffeeGoldGrad)" stroke-width="2.6" opacity="0.9"/>
  <ellipse cx="80" cy="120" rx="24" ry="2.5" fill="#ff007f" opacity="0.3" filter="url(#neonGlowPink)"/>
</svg>
